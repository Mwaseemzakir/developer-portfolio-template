<div class="shared-style fade-in">
  <h2>Education</h2>

  <div class="education-list">
    @for (education of educationDetails; track $index) {
      <div class="education-card">
        <div class="education-header">
          <div class="degree-icon">
            <i class="bi bi-mortarboard-fill"></i>
          </div>
          <div class="degree-info">
            <h3>{{ education.degree }}</h3>
            <p class="institution">
              <i class="bi bi-building"></i>
              {{ education.institution }}
            </p>
          </div>
        </div>
        
        <div class="education-details">
          <div class="detail-item">
            <i class="bi bi-calendar-range"></i>
            <span>{{ education.startDate }} - {{ education.endDate }}</span>
          </div>
          <div class="detail-item grade">
            <i class="bi bi-award-fill"></i>
            <span>Grade: <strong>{{ education.grade }}</strong></span>
          </div>
        </div>
        
        <div class="courses-section">
          <div class="courses-header">
            <i class="bi bi-book-fill"></i>
            <span>Relevant Courses</span>
          </div>
          <div class="courses-grid">
            @for (course of education.courses; track $index) {
              <span class="course-tag">{{ course }}</span>
            }
          </div>
        </div>
      </div>
    }
  </div>
</div>

<style>

    flex-shrink: 0;
}

.institution i {

}

.education-details {

}

    gap: 6px;

    background: #eff6ff;

    font-size: 0.875rem;
    font-weight: 600;
}

.detail-item i {
    color: #2563eb;
    font-size: 1rem;
}

.detail-item.grade {
