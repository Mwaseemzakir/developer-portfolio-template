<div class="shared-style fade-in">
  <h2>{{ contentData.title }}</h2>
  
  <div class="content-intro">
    <div class="intro-icon">
      <i class="bi bi-pen-fill"></i>
    </div>
    <p class="intro-text">{{ contentData.description }}</p>
  </div>

  <div class="platforms-grid">
    @for (platform of contentData.platforms; track $index) {
      <a [href]="platform.url" target="_blank" rel="noopener noreferrer" class="platform-card">
        <div class="platform-icon" [style.background]="platform.gradient">
          <i class="bi" [ngClass]="platform.icon"></i>
        </div>
        <div class="platform-content">
          <h3>{{ platform.name }}</h3>
          <p>{{ platform.description }}</p>
        </div>
        <div class="platform-arrow">
          <i class="bi bi-arrow-right"></i>
        </div>
      </a>
    }
  </div>

  <div class="topics-section">
    <div class="topics-header">
      <i class="bi bi-bookmark-star-fill"></i>
      <span>Topics I Write About</span>
    </div>
    <div class="topics-tags">
      @for (topic of contentData.topics; track $index) {
        <span class="topic-tag">{{ topic }}</span>
      }
    </div>
  </div>
</div>

<style>

    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 20px 20px 20px 24px;
    background: #f8fafc;
    border-radius: 10px;
    margin-bottom: 28px;
    border-left: 3px solid #2563eb;
}

.intro-icon {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 8px;
    background: #2563eb;

}

    line-height: 1.7;

    font-size: 0.9375rem;
    font-weight: 400;
}

.platforms-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));

}

}

.platform-card:hover {
    border-color: #cbd5e1;

}

.platform-icon {
    width: 48px;
    height: 48px;
    min-width: 48px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;

}

.platform-content {
    flex: 1;
}

.platform-content h3 {
    color: #0f172a;

    margin: 0 0 4px 0;
}

.platform-content p {
    color: #64748b;

}
