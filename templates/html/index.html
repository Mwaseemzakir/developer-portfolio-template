<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Professional developer portfolio template for software engineers, technical leads, and IT professionals." />
  <title>Developer Portfolio | IT Professional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Desktop sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <img id="profile-image" alt="" />
      <div class="sidebar-name" id="sidebar-name"></div>
      <div class="sidebar-title" id="sidebar-title"></div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="contact-links" id="contact-links"></div>
      <button class="download-cv" id="download-cv">Download CV</button>
    </div>
  </aside>

  <!-- Mobile top nav -->
  <nav class="mobile-nav" id="mobile-nav"></nav>

  <!-- Main content (rendered by app.js) -->
  <main class="main" id="main"></main>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
