<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer Portfolio Template — Live Demos</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      color: #f1f5f9;
      text-align: center;
    }
    h1 { font-size: clamp(1.75rem, 4vw, 2.75rem); margin: 0; letter-spacing: -0.02em; }
    p.sub { margin: 0; color: #94a3b8; max-width: 38rem; line-height: 1.6; }
    .cards { display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: center; }
    a.card {
      display: block;
      width: 16rem;
      padding: 1.75rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    a.card:hover {
      transform: translateY(-4px);
      border-color: #2563eb;
      background: rgba(37, 99, 235, 0.12);
    }
    a.card h2 { margin: 0 0 0.5rem; font-size: 1.25rem; }
    a.card span { color: #94a3b8; font-size: 0.9rem; }
    footer { color: #64748b; font-size: 0.85rem; }
    footer a { color: #93c5fd; }
  </style>
</head>
<body>
  <header>
    <h1>Developer Portfolio Template</h1>
    <p class="sub">The same portfolio, built in two stacks. Pick a live demo below.</p>
  </header>

  <nav class="cards">
    <a class="card" href="./nextjs/">
      <h2>Next.js (React)</h2>
      <span>Next.js + Tailwind CSS</span>
    </a>
    <a class="card" href="./angular/">
      <h2>Angular</h2>
      <span>Angular + Bootstrap (HTML)</span>
    </a>
  </nav>

  <footer>
    Source on <a href="https://github.com/">GitHub</a> · MIT licensed
  </footer>
</body>
</html>
